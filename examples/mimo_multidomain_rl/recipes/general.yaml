# Native General GRPO semantics, original group filtering, reduced FSDP profile.
hydra:
  searchpath: [pkg://verl.trainer.config]
defaults:
  - ppo_trainer
  - _self_
data:
  train_files: ???
  val_files: ???
  train_batch_size: 1
  gen_batch_size: 1
  val_batch_size: 1
  max_prompt_length: 8192
  max_response_length: 8192
  return_raw_chat: true
  filter_overlong_prompts: false
  truncation: error
  shuffle: false
  dataloader_num_workers: 0
algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  norm_adv_by_std_in_grpo: false
  invalid_reward_value: -999
  filter_groups:
    enable: true
    metric: reward
    max_inflight_gen_batches: 2
  length_penalty:
    enable: true
    max_penalty: 0.1
    deadzone: 0.3
    saturate: 1.0
    pass_threshold: 0.5
    penalty_exponent: 1.5
    anchor_quantile: 0.5
    min_pass_rate: 0.5
actor_rollout_ref:
  hybrid_engine: true
  model:
    path: ???
    lora_rank: 0
    use_remove_padding: false
    use_fused_kernels: false
    enable_gradient_checkpointing: true
    override_config:
      attn_implementation: sdpa
  actor:
    strategy: fsdp
    use_dynamic_bsz: false
    ppo_mini_batch_size: 1
    ppo_micro_batch_size_per_gpu: 1
    ppo_max_token_len_per_gpu: 16384
    loss_agg_mode: prompt-mean
    clip_ratio: 0.2
    entropy_coeff: 0
    use_kl_loss: false
    optim:
      lr: 2e-6
    fsdp_config:
      fsdp_size: 2
      param_offload: true
      optimizer_offload: true
      model_dtype: fp32
      use_torch_compile: false
      entropy_from_logits_with_chunking: true
      entropy_from_logits_chunk_size: 256
  rollout:
    name: vllm
    mode: async
    disable_log_stats: false
    n: 8
    tensor_model_parallel_size: 1
    n_gpus_per_node: 2
    prompt_length: 8192
    response_length: 8192
    max_model_len: 16384
    max_num_batched_tokens: 4096
    max_num_seqs: 2
    gpu_memory_utilization: 0.4
    enforce_eager: true
    free_cache_engine: true
    load_format: safetensors
    calculate_log_probs: true
    log_prob_use_dynamic_bsz: false
    log_prob_micro_batch_size_per_gpu: 1
    temperature: 1.0
    top_p: 0.95
    top_k: -1
    checkpoint_engine:
      backend: naive
    multi_turn:
      enable: true
      format: qwen3_coder
    agent:
      num_workers: 2
      default_agent_loop: mimo_swe_agent
      agent_loop_config_path: ${oc.env:MIMO_GENERAL_AGENT_LOOP_CONFIG}
trainer:
  nnodes: 1
  n_gpus_per_node: 2
  total_epochs: 2
  total_training_steps: 2
  logger: [console, wandb, rl_insight]
  project_name: xDAN-Verl-Uni-agent-Harbor-rl-opd
  use_v1: true
  val_before_train: false
  save_freq: 1
  test_freq: -1
  resume_mode: disable
  max_actor_ckpt_to_keep: 3
  v1:
    trainer_mode: sync
ray_kwargs:
  ray_init:
    num_cpus: 24
    runtime_env:
      worker_process_setup_hook: uni_agent.tasks.mimo_reference.general_bootstrap.install
      env_vars:
        MIMO_GENERAL_RUN_ID: ${trainer.experiment_name}
        MIMO_GENERAL_JUDGE_AUTH_FILE: ${oc.env:MIMO_GENERAL_JUDGE_AUTH_FILE,""}
        GA_JUDGE_URL: ${oc.env:GA_JUDGE_URL}
        GA_JUDGE_MODEL: ${oc.env:GA_JUDGE_MODEL}
        GA_JUDGE_API: ${oc.env:GA_JUDGE_API,chat}
        GA_JUDGE_PHASE_BUDGET: "600"
        VERIFY_AGENT_JUDGE: "1"
        VERIFY_DETERMINISTIC: "1"
        REWARD_BINARIZE: "True"
        REWARD_BINARIZE_THRESHOLD: "1.0"
        INVALID_REWARD_FOR_INFRA: "true"
        FAIL_ON_ENV_SETUP_ERROR: "true"
        GENERAL_INFRA_METRICS: "1"
        EXP_NAME: ${trainer.experiment_name}
        ENV_SETUP_TIMEOUT: "900"
        TRAJECTORY_TIMEOUT: "1200"
        REWARD_TIMEOUT: "900"
        ENV_NUM_CPUS: "0.125"
        MIMOAGENT_BASH_MAX_TIMEOUT_MS: "300000"
