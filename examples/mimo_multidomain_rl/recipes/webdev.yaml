# Native Webdev AgentLoop and pre-advantage group reward on two FSDP GPUs.
hydra:
  searchpath: [pkg://verl.trainer.config]
defaults:
  - ppo_trainer
  - _self_
data:
  train_files: ???
  val_files: ???
  train_batch_size: 1
  gen_batch_size: 1
  val_batch_size: 1
  max_prompt_length: 8192
  max_response_length: 24576
  return_raw_chat: true
  filter_overlong_prompts: false
  truncation: error
  shuffle: false
  dataloader_num_workers: 0
algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  filter_groups:
    enable: false
    metric: reward
    max_inflight_gen_batches: 2
actor_rollout_ref:
  hybrid_engine: true
  model:
    path: ???
    lora_rank: 0
    use_remove_padding: false
    use_fused_kernels: false
    enable_gradient_checkpointing: true
    override_config:
      attn_implementation: sdpa
  actor:
    strategy: fsdp
    use_dynamic_bsz: false
    ppo_mini_batch_size: 1
    ppo_micro_batch_size_per_gpu: 1
    ppo_max_token_len_per_gpu: 32768
    loss_agg_mode: prompt-mean
    clip_ratio: 0.2
    entropy_coeff: 0
    use_kl_loss: false
    optim:
      lr: 1e-6
    fsdp_config:
      fsdp_size: 2
      param_offload: true
      optimizer_offload: true
      model_dtype: fp32
      use_torch_compile: false
      entropy_from_logits_with_chunking: true
      entropy_from_logits_chunk_size: 256
  rollout:
    name: vllm
    mode: async
    disable_log_stats: false
    n: 8
    tensor_model_parallel_size: 1
    n_gpus_per_node: 2
    prompt_length: 8192
    response_length: 24576
    max_model_len: 32768
    max_num_batched_tokens: 8192
    max_num_seqs: 2
    gpu_memory_utilization: 0.4
    enforce_eager: true
    free_cache_engine: true
    load_format: safetensors
    calculate_log_probs: true
    log_prob_use_dynamic_bsz: false
    log_prob_micro_batch_size_per_gpu: 1
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    checkpoint_engine:
      backend: naive
    multi_turn:
      enable: true
      format: qwen3_coder
    agent:
      num_workers: 2
      default_agent_loop: webdev
      agent_loop_config_path: ${oc.env:MIMO_WEBDEV_AGENT_LOOP_CONFIG}
trainer:
  nnodes: 1
  n_gpus_per_node: 2
  total_epochs: 2
  total_training_steps: 1
  logger: [console, wandb, rl_insight]
  project_name: xDAN-Verl-Uni-agent-Harbor-rl-opd
  use_v1: true
  val_before_train: false
  save_freq: 1
  test_freq: -1
  resume_mode: disable
  max_actor_ckpt_to_keep: 3
  v1:
    trainer_mode: colocate_async
    colocate_async:
      num_warmup_batches: 1
    sampler:
      max_off_policy_threshold: 4
      max_off_policy_strategy: drop
ray_kwargs:
  ray_init:
    num_cpus: 24
    runtime_env:
      env_vars:
        WEBDEV_GRADE_MODE: train
        WEBDEV_GRADE_HTTP: "1"
        DROP_INFRA_FROM_GROUP: "1"
        WEBDEV_DEBUG_DIR: ${oc.env:WEBDEV_DEBUG_DIR}
        DESIGN_GRADER_URL: ${oc.env:DESIGN_GRADER_URL,""}
        EXP_NAME: ${trainer.experiment_name}
        REWARD_TIMEOUT: "1500"
        ENV_SETUP_TIMEOUT: "900"
        TRAJECTORY_TIMEOUT: "1800"
        FAIL_ON_ENV_SETUP_ERROR: "true"
        INVALID_REWARD_FOR_INFRA: "false"
