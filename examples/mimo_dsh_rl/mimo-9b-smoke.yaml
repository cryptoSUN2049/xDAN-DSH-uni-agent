# Same-task engineering smoke only: two updates do not establish capability gains.
# Apply with the existing harbor_opd_rl.launch --mode rl --recipe-config entry.
# Model, parser, task, controller registration and receipt policy stay prepared inputs.
trainer:
  nnodes: 1
  n_gpus_per_node: 1
  total_training_steps: 2
  save_freq: 1
  test_freq: -1
  val_before_train: false
  v1:
    trainer_mode: colocate_async
data:
  train_batch_size: 1
  train_max_samples: 1
  val_max_samples: 1
  shuffle: false
  seed: 42
  dataloader_num_workers: 0
  max_prompt_length: 2048
  # Total context includes masked tool observations, not just model generation.
  max_response_length: 30720
actor_rollout_ref:
  model:
    lora_rank: 16
    lora_alpha: 32
    lora:
      merge: true
    # Dense masked SDPA works with the pinned Torch build without external FA2.
    override_config:
      attn_implementation: sdpa
    use_remove_padding: false
    enable_gradient_checkpointing: true
  actor:
    ppo_mini_batch_size: 1
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 32768
    use_torch_compile: false
    data_loader_seed: 42
    # Match the proven single-GPU launcher; avoid layered NO_SHARD offload fallback.
    fsdp_config:
      param_offload: true
      optimizer_offload: true
      use_torch_compile: false
      seed: 42
  rollout:
    nnodes: 0
    n_gpus_per_node: 1
    tensor_model_parallel_size: 1
    n: 4
    seed: 42
    enforce_eager: true
    free_cache_engine: true
    layered_summon: false
    # Native colocate_async uses direct CUDA IPC/ZMQ weight updates.
    checkpoint_engine:
      backend: naive
    gpu_memory_utilization: 0.4
    load_format: safetensors
    max_model_len: 32768
    # Chunk prefill to avoid a full-context vocabulary-sized temporary allocation.
    max_num_batched_tokens: 8192
    max_num_seqs: 1
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 32768
    engine_kwargs:
      vllm:
        reasoning_parser: deepseek_r1
        cpu_offload_gb: 0
    multi_turn:
      max_parallel_calls: 1
    custom:
      agent_framework:
        # r6 exhausted 14336 generated tokens before the 32K context was full.
        max_generated_tokens_per_episode: 20480
        agent_runners:
          task:
            max_concurrent_sessions: 1
