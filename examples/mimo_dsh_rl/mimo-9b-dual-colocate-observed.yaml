# Fresh two-GPU colocate topology test with native W&B and RL-Insight.
# Both topology and concurrency differ from r12; this is not a controlled speed A/B.
# Runtime credentials and RL-Insight service binding remain private operator inputs.
# Opt-in finite-budget MiMo Code engineering smoke; not a capability evaluation.
# Requires matching independently prepared budget-terminal-v1 operator policy.
# Apply with the existing harbor_opd_rl.launch --mode rl --recipe-config entry.
# Model, parser, task, controller registration and receipt policy stay prepared inputs.
trainer:
  logger: [console, wandb, rl_insight]
  project_name: xDAN-Verl-Uni-agent-Harbor-rl-opd
  experiment_name: mimo9b-001661-r13
  nnodes: 1
  n_gpus_per_node: 2
  # World-size-1 checkpoints cannot be resumed as native world-size-2 shards.
  resume_mode: disable
  resume_from_path: null
  total_training_steps: 2
  save_freq: 1
  test_freq: -1
  val_before_train: false
  v1:
    trainer_mode: colocate_async
    colocate_async:
      num_warmup_batches: 1
transfer_queue:
  metrics:
    enabled: true
    port: 0
data:
  train_batch_size: 1
  train_max_samples: 1
  val_max_samples: 1
  shuffle: false
  seed: 42
  dataloader_num_workers: 0
  max_prompt_length: 2048
  # Total context includes masked tool observations, not just model generation.
  max_response_length: 30720
actor_rollout_ref:
  model:
    lora_rank: 16
    lora_alpha: 32
    lora:
      merge: true
    # Dense masked SDPA works with the pinned Torch build without external FA2.
    override_config:
      attn_implementation: sdpa
    use_remove_padding: false
    enable_gradient_checkpointing: true
  actor:
    ppo_mini_batch_size: 1
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 32768
    use_torch_compile: false
    data_loader_seed: 42
    # FSDP spans both shared GPUs; retain the proven CPU offload policy.
    fsdp_config:
      param_offload: true
      optimizer_offload: true
      # Requires the hash-verified MiMo dense entropy source overlay.
      entropy_from_logits_with_chunking: true
      entropy_from_logits_chunk_size: 256
      use_torch_compile: false
      seed: 42
  rollout:
    disable_log_stats: false
    # No standalone pool: two TP1 replicas share the actor's two GPUs.
    nnodes: 0
    n_gpus_per_node: 2
    tensor_model_parallel_size: 1
    data_parallel_size: 1
    pipeline_model_parallel_size: 1
    n: 4
    seed: 42
    enforce_eager: true
    free_cache_engine: true
    layered_summon: false
    # Native colocated workers update their own replica through local IPC.
    checkpoint_engine:
      backend: naive
    gpu_memory_utilization: 0.4
    load_format: safetensors
    max_model_len: 32768
    # Chunk prefill to avoid a full-context vocabulary-sized temporary allocation.
    max_num_batched_tokens: 8192
    max_num_seqs: 2
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 32768
    engine_kwargs:
      vllm:
        reasoning_parser: deepseek_r1
        cpu_offload_gb: 0
    multi_turn:
      max_parallel_calls: 1
    custom:
      agent_framework:
        termination_policy: budget-terminal-v1
        # Admitted budget terminals retain finished=false and the original action mask.
        mask_unfinished_episode: false
        max_generated_tokens_per_episode: 20480
        agent_runners:
          task:
            # One async framework worker can dispatch two independent episodes.
            max_concurrent_sessions: 2
