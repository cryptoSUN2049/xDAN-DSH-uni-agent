# Overlay on this repository's paired VERL ppo_trainer, not a new trainer.
trainer:
  use_v1: true
  nnodes: 1
  n_gpus_per_node: 1
  logger: [console]
  project_name: uni-agent-harbor-opd-rl
  total_epochs: 1
  total_training_steps: 10
  save_freq: 5
  test_freq: 5
  val_before_train: true
  resume_mode: disable
  v1:
    colocate_async:
      num_warmup_batches: 1
    separate_async:
      num_warmup_batches: 1
      parameter_sync_step: 2
    sampler:
      max_off_policy_threshold: 2
      max_off_policy_strategy: drop
transfer_queue:
  enable: true
data:
  prompt_key: prompt
  return_raw_chat: true
  train_batch_size: 2
  max_prompt_length: 2048
  max_response_length: 6144
  truncation: error
  filter_overlong_prompts: true
algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
actor_rollout_ref:
  model:
    lora_rank: 16
    lora_alpha: 32
    target_modules: all-linear
  actor:
    strategy: fsdp
    use_kl_loss: false
    entropy_coeff: 0.0
    ppo_mini_batch_size: 1
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 8192
    optim:
      lr: 0.000001
    fsdp_config:
      model_dtype: bfloat16
      param_offload: false
      optimizer_offload: false
    checkpoint:
      save_contents: [model, optimizer, extra]
      load_contents: [model, optimizer, extra]
  rollout:
    name: vllm
    mode: async
    n: 4
    n_gpus_per_node: 1
    tensor_model_parallel_size: 1
    calculate_log_probs: true
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 8192
    gpu_memory_utilization: 0.6
    enforce_eager: false
    free_cache_engine: true
    layered_summon: false
    max_model_len: 8192
    max_num_batched_tokens: 8192
    max_num_seqs: 8
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    checkpoint_engine:
      backend: nccl
    val_kwargs:
      n: 1
      do_sample: false
    multi_turn:
      enable: true
    agent:
      num_workers: 1
      agent_loop_manager_class: uni_agent.framework.entry.AgentFrameworkRolloutAdapter
    custom:
      agent_framework:
        gateway_count: 1
        fail_on_rollout_error: true
        require_finished_episode: true
        require_verifier_reward: true
        require_trajectory_dump: true
        trajectory_postprocessor_fqn: uni_agent.tasks.harbor_dsh.registration.validate_registered_trajectories
        trajectory_postprocessor_pass_context: true
        agent_runners:
          task:
            runner_fqn: uni_agent.framework.task_runner.run_task
            dispatch_mode: ray_task
            max_concurrent_sessions: 4
            trajectory_selection: all
            runner_kwargs:
              require_result: true
reward:
  reward_model:
    enable: false
distillation:
  enabled: false
  nnodes: 0
  n_gpus_per_node: 1
  distillation_loss:
    loss_mode: k1
    use_policy_gradient: true
    use_task_rewards: true
    distillation_loss_coef: 1.0
