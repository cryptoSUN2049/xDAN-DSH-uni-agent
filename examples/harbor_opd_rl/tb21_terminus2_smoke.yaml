# Terminal-Bench 2.1 Gateway-rollout smoke: Harbor built-in terminus-2 on the host,
# Modal sandbox for the task, model served through the Uni-Agent Gateway.
# Pair with: parallel_infer_verl.py --served-model-name hosted_vllm/<name>
# (litellm strips the hosted_vllm/ prefix and uses HOSTED_VLLM_BASE_URL injected by the adapter).
- name: harbor
  agent:
    name: terminus-2
    timeout_sec: 1800
    kwargs:
      parser_name: json
      temperature: 1.0
      max_turns: 50   # 2026-09-16: attempt1 had 13/16 trajectories hit the 30-turn cap; raised per user
      suppress_max_turns_warning: true
      model_info:
        max_input_tokens: 32768
        max_output_tokens: 4096
        input_cost_per_token: 0
        output_cost_per_token: 0
      llm_call_kwargs:
        max_tokens: 4096
    model:
      temperature: 1.0
      top_p: 1.0
      max_total_tokens: 32768   # episode token budget -> rollout.response_length; runner adds 4096 prompt (user: 16k too small)
  harbor_env: modal
  timeout_multiplier: 1.0
  # Wall clock for the whole trial (env build + agent + verifier). Harbor's
  # --agent-timeout does not cover a sandbox call that never returns: 2026-09-16
  # one fix-git trial hung 30+ min in a Modal API call after context summarization.
  trial_timeout_sec: 1800
  # No resource override: each task's own contract applies (Terminal-Lego asks for
  # 1 cpu / 1 GB, swe-rebench 1 cpu / 2 GB). Modal bills CPU and memory per second
  # for the whole sandbox lifetime, and the old uniform 2 cpu / 4 GB doubled every
  # trial's price for nothing. Set override_cpus / override_memory_mb only to
  # diagnose a task that genuinely needs more.
